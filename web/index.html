<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Cobal Voxel Sandbox (Web)</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div id="overlay">
      <h1>Cobal Voxel Sandbox (Web)</h1>
      <p>Click to play. WASD to move, Space to jump, 1-4 to select blocks.</p>
      <p>Left click breaks, right click places. Esc to release mouse.</p>
    </div>
    <div id="hud">
      <div id="hotbar"></div>
      <div id="crosshair">+</div>
    </div>
    <script type="module" src="main.js"></script>
  </body>
</html>
